[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-integrity-monitor"
version = "1.0.0"
description = "A small, explainable file integrity monitor: hash-based baselines plus real-time filesystem-event detection (portfolio project, not for production use)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["watchdog>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fim = "fim.cli:main"

[tool.setuptools]
packages = ["fim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises the real watchdog Observer against real filesystem events",
]
